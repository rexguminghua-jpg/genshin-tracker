    // 生成当月日历格（当前周高亮，其余周灰显，已打卡日期下方金色圆点，当前周过去未打卡可补打）
    function buildMonthCells(acc, m, today, weekCount, weekPaused) {
      const now = adjustedNow();
      const calYear = now.getFullYear();
      const calMonth = now.getMonth();
      const curWeekStartTs = getWeekStart(now).getTime();
      const firstWeekday = (new Date(calYear, calMonth, 1).getDay() + 6) % 7; // 0=周一
      const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
      const cells = [];
      for (let b = 0; b < firstWeekday; b++) cells.push('<div class="month-cell empty"></div>');
      for (let d = 1; d <= daysInMonth; d++) {
        const dateObj = new Date(calYear, calMonth, d);
        const dk = todayKey(dateObj);
        const isToday = dk === today;
        const isChecked = !!(m.checkIns && m.checkIns[dk]);
        const isFuture = dk > today;
        const inCurWeek = getWeekStart(dateObj).getTime() === curWeekStartTs;
        const canCheckIn = m.participated && !m.finished && m.weekParticipated && !isChecked && !isFuture && inCurWeek && weekCount < CHECKINS_PER_TASK;
        const cls = ['month-cell'];
        if (!inCurWeek) cls.push('other-week');
        if (isToday) cls.push('today');
        if (isChecked) cls.push('done');
        if (isFuture) cls.push('future');
        if (canCheckIn) cls.push('clickable');
        cells.push(`<button class="${cls.join(' ')}" ${canCheckIn ? `data-checkin-date="${dk}"` : ''}>
          <span class="month-day">${d}</span>
          <span class="month-dot ${isChecked ? 'on' : ''}"></span>
        </button>`);
      }
      return cells;
    }

    function bindDetailLixyEvents(acc, m, weekCount) {
      // 3 个开关
      root.querySelectorAll('[data-toggle]').forEach(input => {
        input.addEventListener('change', () => {
          const k = input.dataset.toggle;
          if (k === 'focus') {
            acc.liXingXiuYuan.focusTraining = !acc.liXingXiuYuan.focusTraining;
            saveState();
            render();
          } else if (k === 'lxy') {
            toggleParticipate(acc.id, 'liXingXiuYuan');
          } else if (k === 'lxyWeek') {
            if (input.checked) {
              // 即将开启 → 二次确认
              if (confirm('确定要开启本周砺行修远活动吗？开启后可继续打卡。')) {
                setWeekParticipate(acc.id, true);
              } else {
                // 取消 → 恢复 checkbox 状态
                input.checked = false;
              }
            } else {
              // 关闭 → 直接关闭（不弹确认，避免误触）
              setWeekParticipate(acc.id, false);
            }
          }
        });
      });
      // checkin
      document.getElementById('btnCheckin')?.addEventListener('click', () => { checkInToday(acc.id); render(); });
      document.getElementById('btnUndo')?.addEventListener('click', () => { undoTodayCheckIn(acc.id); render(); });
      document.getElementById('btnResetWeek')?.addEventListener('click', () => {
        if (confirm('重置本周打卡？此操作仅清除本周内打卡，不影响累计任务数。')) {
          resetWeek(acc.id); render();
        }
      });
      document.getElementById('btnResetLixy')?.addEventListener('click', () => {
        if (confirm('重置砺行修远全部进度？任务计数、已打卡日期都会清空，请谨慎操作。')) {
          resetLixyAll(acc.id); render();
          showToast('进度已重置');
        }
      });
      // 补打卡
      root.querySelectorAll('[data-checkin-date]').forEach(cell => {
        cell.addEventListener('click', () => {
          checkInOnDate(acc.id, cell.dataset.checkinDate);
          render();
        });
      });
      // 历练点
      const pointsInput = document.getElementById('inpRemainingPoints');
      pointsInput?.addEventListener('change', () => {
        updateRemainingPoints(acc.id, pointsInput.value);
        showToast('历练点已更新');
        render();
      });
      // 🔧 校准进度：按实际打卡记录重算总任务进度
      const btnCal = root.querySelector('#btnCalibrate');
      if (btnCal) btnCal.addEventListener('click', () => {
        const r = calibrateAccount(acc.id);
        if (!r) return;
        if (r.changed) showToast(`🔧 已校准总任务进度：${r.before} → ${r.after}`);
        else showToast(`✓ 总任务进度正常（${r.after}/${TASK_TOTAL_REQUIRED}）`);
        render();
      });
    }

    // ===== 详情页 - 日常活动 Tab（v1.9.14 卡片化 2×2） =====
    function renderDetailDaily(acc, d, spiral, theatre, stygian) {
      spiral = spiral || { participated: false, currentFloor: 1, currentChamber: 1, completed: false };
      theatre = theatre || { participated: false, elements: [] };

      // 日常活动：剩余时间信息
      const dailyRemain = d.deadline ? timeRemainingInfo(d.deadline) : null;
      const dailyRemainHtml = !d.participated ? '' : (dailyRemain ? `
        <div class="remain-bar">
          <div class="remain-track"><div class="remain-fill" style="width:${Math.round(dailyRemain.ratio*100)}%;background:${dailyRemain.color}"></div></div>
          <span class="remain-label" style="color:${dailyRemain.color}">${dailyRemain.label}</span>
        </div>
        <div class="help-note-inline">截止 ${d.deadline}${dailyRemain.expired ? '（已结束，已自动转为暂无活动）' : ''}</div>
      ` : '<div class="help-note-inline warn">⚠ 参与日常活动需设置活动截止时间</div>');

      // 深境螺旋 / 剧诗：周期剩余（固定周期）
      const spiralEnd = spiralCycleEnd();
      const spiralRemain = timeRemainingInfo(spiralEnd);
      const theatreEnd = theatreCycleEnd();
      const theatreRemain = timeRemainingInfo(theatreEnd);

      // 幽境危战：剩余 + 爆发期
      const stygianRemain = stygian.deadline ? timeRemainingInfo(stygian.deadline, stygian.startDate) : null;
      let stygianBurst = null;
      if (stygian.startDate) {
        const sd = parseDateKey(stygian.startDate);
        if (sd) {
          const burstEnd = new Date(sd.getFullYear(), sd.getMonth(), sd.getDate() + 10, 23, 59, 59);
          const burstKey = `${burstEnd.getFullYear()}-${String(burstEnd.getMonth()+1).padStart(2,'0')}-${String(burstEnd.getDate()).padStart(2,'0')}`;
          stygianBurst = timeRemainingInfo(burstKey);
        }
      }

      // 限制元素已选集合
      const theatreSel = Array.isArray(theatre.elements) ? theatre.elements : [];

      // ─────────── 卡片 1：日常活动 ───────────
      const dailyStage   = d.stage || 'none';
      const dailyLabel   = d.participated ? (DAILY_STAGE_LABELS[dailyStage] || '待接取') : '未参与';
      const dailyStatusCls = !d.participated ? 's-gray'
        : dailyStage === 'completed'   ? 's-green'
        : dailyStage === 'in_progress' ? 's-orange'
        : dailyStage === 'pending'     ? 's-blue'
        :                                's-gray';
      const card1 = `
        <div class="daily-card ${d.participated ? '' : 'off'}">
          <div class="daily-card-head">
            <div class="daily-card-title">
              <span class="dot" style="background:var(--blue)"></span>
              <span>日常活动</span>
            </div>
            <span class="daily-status ${dailyStatusCls}">${dailyLabel}</span>
          </div>
          <div class="daily-card-body">
            <div class="field-row">
              <label class="field-label">参与开关</label>
              <label class="switch switch-blue">
                <input type="checkbox" data-toggle="daily" ${d.participated ? 'checked' : ''}>
                <span class="switch-slider"></span>
              </label>
            </div>
            ${d.participated ? `
              <div class="field-row">
                <label class="field-label">活动截止时间</label>
                <input type="date" class="field-input" data-daily-deadline value="${d.deadline || ''}">
              </div>
              ${dailyRemainHtml}
              ${d.stage === 'none' ? `
                <div class="help-note">暂无活动。开启参与开关后进入「待接取」。</div>
              ` : `
                <div class="state-machine">
                  ${DAILY_STAGES.map(s => `
                    <button class="sm-state ${d.stage === s ? 'current ' + s : ''}" data-set-progress="${s}">
                      ${DAILY_STAGE_LABELS[s]}
                    </button>
                  `).join('')}
                </div>
                <div class="action-bar">
                  <button class="btn btn-blue" id="btnAdvanceProgress" ${d.stage === 'completed' ? 'disabled style="opacity:.5;cursor:not-allowed"' : ''}>
                    ⏩ 推进到下一阶段
                  </button>
                </div>
              `}
            ` : `<div class="daily-card-empty">开启后可设置活动截止时间并跟踪日常任务进度。</div>`}
          </div>
        </div>
      `;

      // ─────────── 卡片 2：深境螺旋 ───────────
      const spiralLabel    = !spiral.participated ? '未参与' : (spiral.completed ? '已通关' : '进行中');
      const spiralStatusCls = !spiral.participated ? 's-gray' : (spiral.completed ? 's-green' : 's-teal');
      const card2 = `
        <div class="daily-card ${spiral.participated ? '' : 'off'}">
          <div class="daily-card-head">
            <div class="daily-card-title">
              <span class="dot" style="background:var(--teal)"></span>
              <span>深境螺旋</span>
            </div>
            <span class="daily-status ${spiralStatusCls}">${spiralLabel}</span>
          </div>
          <div class="daily-card-body">
            <div class="field-row">
              <label class="field-label">参与开关</label>
              <label class="switch switch-blue-2">
                <input type="checkbox" data-toggle="spiral" ${spiral.participated ? 'checked' : ''}>
                <span class="switch-slider"></span>
              </label>
            </div>
            ${spiral.participated ? `
              <div class="help-note-inline">周期固定：本月 16 日 → 下月 15 日，每月重置。</div>
              <div class="remain-bar">
                <div class="remain-track"><div class="remain-fill" style="width:${Math.round(spiralRemain.ratio*100)}%;background:${spiralRemain.color}"></div></div>
                <span class="remain-label" style="color:${spiralRemain.color}">${spiralRemain.label}（至 ${spiralEnd}）</span>
              </div>
              <div class="select-pair">
                <div>
                  <label>层数</label>
                  <select class="field-select" data-spiral-floor>
                    ${Array.from({length:12},(_,i)=>i+1).map(f => `<option value="${f}" ${spiral.currentFloor==f?'selected':''}>第${f}层</option>`).join('')}
                  </select>
                </div>
                <div>
                  <label>间数</label>
                  <select class="field-select" data-spiral-chamber>
                    ${[1,2,3].map(c => `<option value="${c}" ${spiral.currentChamber==c?'selected':''}>第${c}间</option>`).join('')}
                  </select>
                </div>
              </div>
              <div style="display:flex;align-items:center;gap:8px;margin-top:2px">
                <input type="checkbox" id="chkSpiralDone" ${spiral.completed ? 'checked' : ''} style="width:16px;height:16px;cursor:pointer" />
                <label for="chkSpiralDone" style="font-size:13px;color:var(--text);cursor:pointer">本期已完成通关</label>
              </div>
            ` : `<div class="daily-card-empty">开启后可记录当前挑战进度。</div>`}
          </div>
        </div>
      `;

      // ─────────── 卡片 3：幻想真境剧诗 ───────────
      const theatreLabel    = theatre.participated ? '进行中' : '未参与';
      const theatreStatusCls = theatre.participated ? 's-purple' : 's-gray';
      const card3 = `
        <div class="daily-card ${theatre.participated ? '' : 'off'}">
          <div class="daily-card-head">
            <div class="daily-card-title">
              <span class="dot" style="background:#7a5cc0"></span>
              <span>幻想真境剧诗</span>
            </div>
            <span class="daily-status ${theatreStatusCls}">${theatreLabel}</span>
          </div>
          <div class="daily-card-body">
            <div class="field-row">
              <label class="field-label">参与开关</label>
              <label class="switch switch-purple">
                <input type="checkbox" data-toggle="theatre" ${theatre.participated ? 'checked' : ''}>
                <span class="switch-slider"></span>
              </label>
            </div>
            ${theatre.participated ? `
              <div class="help-note-inline">周期固定：当月 1 日 → 月底，每月重置。</div>
              <div class="remain-bar">
                <div class="remain-track"><div class="remain-fill" style="width:${Math.round(theatreRemain.ratio*100)}%;background:${theatreRemain.color}"></div></div>
                <span class="remain-label" style="color:${theatreRemain.color}">${theatreRemain.label}（至 ${theatreEnd}）</span>
              </div>
              <div class="field-label" style="margin-top:2px">当期限制元素（最多 3 个）</div>
              <div class="elem-show">
                ${theatreSel.length ? theatreSel.map(k => {
                  const el = GENSHIN_ELEMENTS.find(e => e.key === k);
                  return el ? `<span class="elem-badge" style="background:${el.color}">${el.name}</span>` : '';
                }).join('') : '<span class="help-note-inline">尚未设置限制元素</span>'}
              </div>
              <div class="elem-picker">
                ${GENSHIN_ELEMENTS.map(e => `
                  <button class="elem-opt ${theatreSel.includes(e.key) ? 'on' : ''}" data-elem="${e.key}" ${theatreSel.length >= 3 && !theatreSel.includes(e.key) ? 'disabled style="opacity:.4;cursor:not-allowed"' : ''}>
                    <span class="elem-dot" style="background:${e.color}"></span>${e.name}
                  </button>
                `).join('')}
              </div>
            ` : `<div class="daily-card-empty">开启后此账号将纳入该模块汇总统计。</div>`}
          </div>
        </div>
      `;

      // ─────────── 卡片 4：幽境危战 ───────────
      const stygianDoneNum = (stygian.challenges || []).filter(c => c && c.done === 'yes').length;
      const stygianLabel   = !stygian.participated ? '未参与'
        : (stygianDoneNum === STYGIAN_DIFFICULTIES.length ? `${stygianDoneNum}/${STYGIAN_DIFFICULTIES.length} 已完成` : `进行中 ${stygianDoneNum}/${STYGIAN_DIFFICULTIES.length}`);
      const stygianStatusCls = !stygian.participated ? 's-gray'
        : (stygianDoneNum === STYGIAN_DIFFICULTIES.length ? 's-green' : 's-orange');
      const card4 = `
        <div class="daily-card ${stygian.participated ? '' : 'off'}">
          <div class="daily-card-head">
            <div class="daily-card-title">
              <span class="dot" style="background:var(--orange)"></span>
              <span>幽境危战</span>
            </div>
            <span class="daily-status ${stygianStatusCls}">${stygianLabel}</span>
          </div>
          <div class="daily-card-body">
            <div class="field-row">
              <label class="field-label">参与开关</label>
              <label class="switch switch-orange">
                <input type="checkbox" data-toggle="stygian" ${stygian.participated ? 'checked' : ''}>
                <span class="switch-slider"></span>
              </label>
            </div>
            ${stygian.participated ? `
              <div class="field-row">
                <label class="field-label">活动开启日期</label>
                <input type="date" class="field-input" data-stygian-date="startDate" value="${stygian.startDate || ''}">
              </div>
              <div class="field-row">
                <label class="field-label">活动截止时间</label>
                <input type="date" class="field-input" data-stygian-date="deadline" value="${stygian.deadline || ''}">
              </div>
              ${stygianRemain ? `
                <div class="remain-bar">
                  <div class="remain-track"><div class="remain-fill" style="width:${Math.round(stygianRemain.ratio*100)}%;background:${stygianRemain.color}"></div></div>
                  <span class="remain-label" style="color:${stygianRemain.color}">活动${stygianRemain.label}</span>
                </div>
              ` : '<div class="help-note-inline warn">⚠ 参与幽境危战需设置活动截止时间</div>'}
              <div class="remain-bar">
                <div class="remain-track"><div class="remain-fill" style="width:${stygianBurst ? Math.round(stygianBurst.ratio*100) : 0}%;background:${stygianBurst ? stygianBurst.color : 'var(--gray)'}"></div></div>
                <span class="remain-label" style="color:${stygianBurst ? stygianBurst.color : 'var(--gray)'}">${stygianBurst ? ('爆发期' + stygianBurst.label) : (stygian.startDate ? '爆发期已结束' : '爆发期（开启后10天）未设置开启日期')}</span>
              </div>
              <div class="field-label" style="margin-top:4px">完成情况</div>
              <div class="stygian-list">
                ${STYGIAN_DIFFICULTIES.map((name, i) => {
                  const c = stygian.challenges[i] || { done: null };
                  return `
                    <div class="stygian-row">
                      <span class="stygian-name">幽境危战 ${i+1}－${name}</span>
                      <div class="radio-group">
                        <label class="radio-opt ${c.done === 'no' ? 'on' : ''}"><input type="radio" name="stygian_${i}" data-stygian-ch="${i}" value="no" ${c.done === 'no' ? 'checked' : ''}>未完成</label>
                        <label class="radio-opt ${c.done === 'yes' ? 'on' : ''}"><input type="radio" name="stygian_${i}" data-stygian-ch="${i}" value="yes" ${c.done === 'yes' ? 'checked' : ''}>已完成</label>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            ` : `<div class="daily-card-empty">开启后此账号将纳入该模块汇总统计。</div>`}
          </div>
        </div>
      `;

      return `
        <section class="card module-card">
          <div class="daily-grid">
            ${card1}
            ${card2}
            ${card3}
            ${card4}
          </div>
        </section>
      `;
    }

    function bindDetailDailyEvents(acc, d, spiral, theatre, stygian) {
      // 4 个开关
      root.querySelectorAll('[data-toggle]').forEach(input => {
        input.addEventListener('change', () => {
          const k = input.dataset.toggle;
          if (k === 'daily') toggleParticipate(acc.id, 'dailyActivities');
          else if (k === 'spiral') toggleSpiral(acc.id);
          else if (k === 'theatre') toggleTheatre(acc.id);
          else if (k === 'stygian') toggleStygian(acc.id);
          render();
        });
      });
      // 日常活动进度切换
      root.querySelectorAll('[data-set-progress]').forEach(b => {
        b.addEventListener('click', () => { setDailyProgress(acc.id, b.dataset.setProgress); render(); });
      });
      document.getElementById('btnAdvanceProgress')?.addEventListener('click', () => { advanceDailyProgress(acc.id); render(); });
      // 日常活动截止时间
      const dailyDeadline = root.querySelector('[data-daily-deadline]');
      dailyDeadline?.addEventListener('change', () => { setDailyDeadline(acc.id, dailyDeadline.value || null); render(); });
      // 幻想真境剧诗 — 限制元素多选
      root.querySelectorAll('[data-elem]').forEach(b => {
        b.addEventListener('click', () => {
          const key = b.dataset.elem;
          const cur = Array.isArray(acc.imaginationTheatre.elements) ? acc.imaginationTheatre.elements.slice() : [];
          const idx = cur.indexOf(key);
          if (idx >= 0) cur.splice(idx, 1);
          else if (cur.length < 3) cur.push(key);
          setTheatreElements(acc.id, cur);
          render();
        });
      });
      // 幽境危战 — 开启日期 / 截止时间
      root.querySelectorAll('[data-stygian-date]').forEach(inp => {
        inp.addEventListener('change', () => { setStygianDate(acc.id, inp.dataset.stygianDate, inp.value || null); render(); });
      });
      // 幽境危战 — 5 难度完成单选
      root.querySelectorAll('[data-stygian-ch]').forEach(r => {
        r.addEventListener('change', () => { setStygianChallenge(acc.id, parseInt(r.dataset.stygianCh), r.value); render(); });
      });
      // 深境螺旋
      const floorSel = root.querySelector('[data-spiral-floor]');
      const chamberSel = root.querySelector('[data-spiral-chamber]');
      const doneChk = document.getElementById('chkSpiralDone');
      floorSel?.addEventListener('change', () => { updateSpiralProgress(acc.id, floorSel.value, null, null); render(); });
      chamberSel?.addEventListener('change', () => { updateSpiralProgress(acc.id, null, chamberSel.value, null); render(); });
      doneChk?.addEventListener('change', () => { updateSpiralProgress(acc.id, null, null, doneChk.checked); render(); });
    }

    /* ============================================================
     * 模态框
     * ============================================================ */
    function openAddAccountModal() {
      state.modal = 'addAccount';
      state.modalCtx = {};
      render();
    }
    function openEditAccountModal(id) {
      const acc = findAccount(id);
      if (!acc) return;
      state.modal = 'editAccount';
      state.modalCtx = { id };
      render();
    }
    function closeModal() {
      state.modal = null;
      state.modalCtx = {};
      render();
    }

    function renderModal() {
      let modal = document.querySelector('.modal-mask');
      modal?.remove();
      if (!state.modal) return;

      if (state.modal === 'addAccount' || state.modal === 'editAccount') {
        const editing = state.modal === 'editAccount';
        const acc = editing ? findAccount(state.modalCtx.id) : null;
        const v = editing ? acc : { name: '', uid: '', server: '国服', note: '' };
        modal = document.createElement('div');
        modal.className = 'modal-mask';
        modal.innerHTML = `
          <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-head">
              <div class="modal-title">${editing ? '编辑账号' : '新建账号'}</div>
              <button class="modal-close" data-act="close">✕</button>
            </div>
            <div class="modal-body">
              <div class="field">
                <label class="field-label">账号名称 <span style="color:var(--red)">*</span></label>
                <input class="field-input" id="inpName" placeholder="如：主号 / 小号-A" value="${escapeHtml(v.name)}" />
              </div>
              <div class="field">
                <label class="field-label">UID（可选）</label>
                <input class="field-input" id="inpUid" placeholder="9 位游戏 UID" value="${escapeHtml(v.uid)}" inputmode="numeric" />
              </div>
              <div class="field">
                <label class="field-label">服务器</label>
                <select class="field-select" id="inpServer">
                  ${['国服','B服','国际服','港澳台'].map(s => `<option ${v.server===s?'selected':''}>${s}</option>`).join('')}
                </select>
              </div>
              <div class="field">
                <label class="field-label">备注（可选）</label>
                <input class="field-input" id="inpNote" placeholder="例如：冒险等阶 60" value="${escapeHtml(v.note || '')}" />
              </div>
            </div>
            <div class="modal-foot">
              <button class="btn" data-act="close">取消</button>
              <button class="btn btn-primary" data-act="save">${editing ? '保存' : '创建'}</button>
            </div>
          </div>
        `;
        document.body.appendChild(modal);
        modal.querySelectorAll('[data-act=close]').forEach(b => b.addEventListener('click', closeModal));
        modal.querySelector('[data-act=save]').addEventListener('click', () => {
          const name = document.getElementById('inpName').value.trim();
          const uid = document.getElementById('inpUid').value.trim();
          const server = document.getElementById('inpServer').value;
          const note = document.getElementById('inpNote').value.trim();
          if (!name) { showToast('请填写账号名称'); return; }
          if (editing) {
            updateAccount(acc.id, { name, uid, server, note });
            closeModal();
            showToast('已保存');
          } else {
            newAccount({ name, uid, server, note });
            closeModal();
            showToast('账号已创建');
          }
        });
        modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
        return;
      }

      if (state.modal === 'help') {
        modal = document.createElement('div');
        modal.className = 'modal-mask';
        modal.innerHTML = `
          <div class="modal" onclick="event.stopPropagation()" style="max-width:560px">
            <div class="modal-head">
              <div class="modal-title">使用说明</div>
              <button class="modal-close" data-act="close">✕</button>
            </div>
            <div class="modal-body about">
              <h3>📊 汇总标签页</h3>
              <ul>
                <li>全局概览：账号总数、砺行修远参与/收官、今日打卡统计。</li>
                <li>设置活动结束日期后自动显示剩余周数，≤2 周红色高亮提醒。</li>
                <li>账号进度明细表格：砺行修远累计、本周打卡、今日打卡、剩余历练点、日常活动一目了然。</li>
                <li>未完成账号高亮显示，点击「跟进 →」跳转至账号详情页。</li>
                <li>历练点颜色：<strong style="color:var(--red)">&lt;12 红色</strong>（尽快补充）、<strong style="color:var(--orange)">12~40 橙色</strong>（偏低）、<strong style="color:var(--green)">≥40 绿色</strong>。</li>
              </ul>
              <h3>🎮 账号标签页</h3>
              <ul>
                <li>账号列表：新增/编辑/删除账号，卡片显示进度概览。</li>
                <li>支持「📥 批量导入」：下载 CSV 模板，填写后批量导入多个账号。</li>
                <li>点击账号卡片进入详情页，进行打卡和状态管理。</li>
              </ul>
              <h3>📜 砺行修远模块</h3>
              <ul>
                <li>每打卡 1 天算 1 次，每周打满 5 次自动完成 1 次「砺行修远」任务。</li>
                <li>累计完成 8 次任务后即收官，会显示「🎉 收官」徽章。</li>
                <li>每天只能打卡 1 次，重复点击会提示已打卡。</li>
                <li>跨自然周（周一）后，本周打卡数会自动清零。</li>
                <li><strong>本期是否参与</strong>：整个活动周期的参与开关，关闭后不再累计。</li>
                <li><strong>本周是否参与</strong>：每周可独立控制，关闭时本周打卡按钮禁用、日历显示「本周暂停任务」；开启时需二次确认，已有打卡数据保留。</li>
                <li><strong>本周期重点</strong>（⭐）：标注此账号为本砺行修远周期的侧重练号，汇总页显示星标。</li>
              </ul>
              <h3>🌿 日常活动模块</h3>
              <ul>
                <li>包含 4 个子模块，每个可独立开关：日常活动、深境螺旋、幻想真境剧诗、幽境危战。</li>
                <li><strong>日常活动</strong>：状态机 <strong>暂停 → 进行中 → 已完成</strong>。点击对应阶段卡片可直接切换，或用「推进到下一阶段」按钮。</li>
                <li><strong>深境螺旋</strong>：选择当前挑战进度（第 N 层 / 第 M 间），并可标记「本期已完成通关」。</li>
                <li><strong>幻想真境剧诗</strong> / <strong>幽境危战</strong>：仅参与开关，无进度跟踪。</li>
              </ul>
              <h3>🛠 数据 & 云同步</h3>

    // 剩余周数（距活动结束）
    function remainingWeeks() {
      if (!state.activityEndDate) return null;
      const now = new Date(); now.setHours(0,0,0,0);
      const end = new Date(state.activityEndDate); end.setHours(0,0,0,0);
      const diff = end - now;
      if (diff < 0) return 0;
      return Math.ceil(diff / (7 * 86400000));
    }

    // CSV 工具：解析一行（支持引号包裹）
    function parseCsvLine(line) {
      const result = [];
      let cur = '', inQ = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (inQ) {
          if (ch === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else inQ = false; }
          else cur += ch;
        } else {
          if (ch === '"') inQ = true;
          else if (ch === ',') { result.push(cur); cur = ''; }
          else cur += ch;
        }
      }
      result.push(cur);
      return result.map(s => s.trim());
    }

    // CSV 工具：解析布尔值
    function parseCsvBool(val) {
      const v = (val || '').trim().toLowerCase();
      return ['是', 'true', '1', 'yes', 'y', '✓', '参与'].includes(v);
    }

    // CSV 工具：解析日常活动阶段（v1.9.13 四状态）
    function parseCsvProgress(val) {
      const v = (val || '').trim().toLowerCase();
      if (['进行中', 'in_progress', '进行', 'progress'].includes(v)) return 'in_progress';
      if (['已完成', 'completed', '完成', 'done'].includes(v)) return 'completed';
      if (['待接取', 'pending'].includes(v)) return 'pending';
      return 'none'; // 暂停 / 暂无活动 / paused / 空
    }

    // CSV 模板下载
    function downloadCsvTemplate() {
      const header = '账号名称,UID,服务器,是否参与砺行修远,本周是否参与,砺行修远已完成任务数,剩余历练点,是否参与日常活动,日常活动进度,是否参与深境螺旋,深境螺旋当前层,深境螺旋当前间,深境螺旋是否通关,是否参与幻想真境剧诗,是否参与幽境危战\n';
      const row1  = '主号,100123456,国服,是,是,3,50.0,是,进行中,是,8,2,否,是,是\n';
      const row2  = '小号A,100234567,B服,否,否,0,,是,暂停,否,1,1,否,否,否\n';
      const row3  = '小号B,100345678,国服,是,是,8,,否,已完成,是,12,3,是,否,是\n';
      const note  = '\n'
        + '# 字段说明：\n'
        + '# 是否参与(各模块)：填 是 或 否\n'
        + '# 本周是否参与：填 是 或 否（需先开启「本期是否参与」）\n'
        + '# 砺行修远已完成任务数：0-8 的整数\n'
        + '# 剩余历练点：小数，精确到1位（如 50.0），不填则留空\n'
        + '# 日常活动进度：暂无活动 / 待接取 / 进行中 / 已完成\n'
        + '# 深境螺旋当前层/间：1-12 / 1-3\n'
        + '# 深境螺旋是否通关：是 / 否（选「是」时进度自动归位到 12-3）\n';
      const csv = header + row1 + row2 + row3 + note;
      const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = '账号导入模板.csv';

      URL.revokeObjectURL(url);

    // 批量导入 CSV（兼容 UTF-8 / GBK 编码 + 引号字段）
    function batchImportFromCsv() {
      const input = document.createElement('input');
      input.type = 'file'; input.accept = '.csv,text/csv';
      input.onchange = () => {
        const f = input.files?.[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = () => {
          try {
            const buf = new Uint8Array(r.result);
            // 编码检测：先试 UTF-8，出现替换字符则回退 GBK
            let text = new TextDecoder('utf-8', { fatal: false }).decode(buf);
            if (text.includes('\uFFFD')) {
              text = new TextDecoder('gbk').decode(buf);
            }
            // 去 BOM
            text = text.replace(/^\ufeff/, '');
            const lines = text.split(/\r?\n/).filter(l => l.trim() && !l.startsWith('#'));
            if (lines.length < 2) throw new Error('文件为空或只有表头');
            const rows = lines.slice(1); // 跳过表头
            let count = 0;
            rows.forEach(line => {
              const cols = parseCsvLine(line);
              if (!cols[0]) return;
              const tasksDone = Math.min(8, Math.max(0, parseInt(cols[5]) || 0));
              const finished = tasksDone >= 8;
              const pts = cols[6] ? parseFloat(cols[6]) : NaN;
              const spiralFloor = Math.min(12, Math.max(1, parseInt(cols[10]) || 1));
              const spiralChamber = Math.min(3, Math.max(1, parseInt(cols[11]) || 1));
              const spiralCompleted = parseCsvBool(cols[12]);
              const acc = {
                id: uid(),
                name: cols[0] || '未命名账号',
                uid: (cols[1] || '').trim(),
                server: (cols[2] || '国服').trim(),
                note: '',
                createdAt: new Date().toISOString(),
                liXingXiuYuan: {
                  participated: parseCsvBool(cols[3]),
                  weekParticipated: parseCsvBool(cols[4]),
                  focusTraining: false,
                  checkIns: {},
                  weeks: {},
                  tasksDone: tasksDone,
                  finished: finished,
                  finishedAt: finished ? new Date().toISOString() : null,
                  remainingPoints: !isNaN(pts) ? Math.round(pts * 10) / 10 : null
                },
                dailyActivities: {
                  participated: parseCsvBool(cols[7]),
                  stage: parseCsvProgress(cols[8]),
                  deadline: null,
                  lastChangedAt: null
                },
                spiralAbyss: {
                  participated: parseCsvBool(cols[9]),
                  currentFloor: spiralCompleted ? 12 : spiralFloor,
                  currentChamber: spiralCompleted ? 3 : spiralChamber,
                  completed: spiralCompleted
                },
                imaginationTheatre: {
                  participated: parseCsvBool(cols[13])
                },
                stygianOnslaught: {
                  participated: parseCsvBool(cols[14])
                }
              };
              state.accounts.push(acc);
              count++;
            });
            saveState();
            render();
            showToast(`成功导入 ${count} 个账号`);
          } catch (e) {
            alert('导入失败：' + e.message);
          }
        };
        r.readAsArrayBuffer(f);
      };
      input.click();
    }

    function importDataFromFile() {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'application/json,.json';
      input.onchange = () => {
        const f = input.files?.[0];

        const r = new FileReader();
        r.onload = () => {
          try {
            const data = JSON.parse(r.result);
            if (!Array.isArray(data.accounts)) throw new Error('数据格式不正确');
            const choice = confirm('导入将覆盖当前账号数据，是否继续？\n确定 = 覆盖导入\n取消 = 合并导入');
            if (choice) {
              state.accounts = data.accounts;
            } else {
              // 合并：按 id 去重
              const map = new Map(state.accounts.map(a => [a.id, a]));
              data.accounts.forEach(a => map.set(a.id, a));
              state.accounts = [...map.values()];
            }
            saveState();
            render();
            showToast('导入完成');
          } catch (e) {
            alert('导入失败：' + e.message);
          }
        };
        r.readAsText(f);
      };
      input.click();
    }

    /* ============================================================
     * 云同步 (jsonbin.io)
     * ============================================================ */
    const JSONBIN_BASE = 'https://api.jsonbin.io/v3/b';

    function syncHeaders(extra = {}) {
      return { 'X-Master-Key': state.sync.apiKey, 'Content-Type': 'application/json', ...extra };
    }

    async function syncPull() {
      if (!state.sync.enabled || !state.sync.apiKey || !state.sync.code) { cloudPulled = true; return; }
      state.sync.status = 'syncing'; updateSyncBtn();
      try {
        const res = await fetch(`${JSONBIN_BASE}/${state.sync.code}/latest`, {
          headers: { 'X-Master-Key': state.sync.apiKey }
        });
        if (!res.ok) { state.sync.status = 'err'; updateSyncBtn(); cloudPulled = true; return; }
        const data = await res.json();
        const record = data.record;
        if (record && record.accounts) {
          state.accounts = Array.isArray(record.accounts) ? record.accounts.map(migrateAccount) : [];
          state.activityEndDate = record.activityEndDate || null;
          persistLocal();
          state.sync.status = 'on'; updateSyncBtn();
          render();
          showToast('已从云端同步最新数据');
        } else {
          state.sync.status = 'on'; updateSyncBtn();
        }
      } catch (e) {
        state.sync.status = 'err'; updateSyncBtn();
      }
      cloudPulled = true;
    }

    let pushTimer = null;
    function syncPush() {
      if (!state.sync.enabled || !state.sync.apiKey || !state.sync.code) return;
      if (!cloudPulled) return; // 首次拉取完成前阻止推送，防止空数据覆盖云端
      clearTimeout(pushTimer);
      pushTimer = setTimeout(async () => {
        state.sync.status = 'syncing'; updateSyncBtn();
        try {
          const res = await fetch(`${JSONBIN_BASE}/${state.sync.code}`, {
            method: 'PUT',
            headers: syncHeaders(),
            body: JSON.stringify({ accounts: state.accounts, activityEndDate: state.activityEndDate, updatedAt: new Date().toISOString() })
          });
          state.sync.status = res.ok ? 'on' : 'err';
        } catch (e) {
          state.sync.status = 'err';
        }
        updateSyncBtn();
      }, 1500); // 1.5s 防抖
    }

    async function testSync() {
      const apiKey = document.getElementById('inpSyncApiKey')?.value.trim() || '';
      const code = document.getElementById('inpSyncCode')?.value.trim() || '';
      if (!apiKey) { showToast('请输入 API Key'); return; }
      if (!code) { showToast('请输入同步码（或点「生成」）'); return; }
      try {
        const res = await fetch(`${JSONBIN_BASE}/${code}/latest`, {
          headers: { 'X-Master-Key': apiKey }
        });
        if (res.ok) { showToast('✅ 连接成功（云端有数据）'); }
        else if (res.status === 404) { showToast('✅ 连接成功（暂无云端数据）'); }
        else { showToast('❌ 连接失败：HTTP ' + res.status); }
      } catch (e) {
        showToast('❌ 连接失败：' + e.message);
      }
    }

    async function generateSyncCode() {
      const apiKey = document.getElementById('inpSyncApiKey')?.value.trim() || '';
      if (!apiKey) { showToast('请先输入 API Key'); return; }
      try {
        const res = await fetch(JSONBIN_BASE, {
          method: 'POST',
          headers: { 'X-Master-Key': apiKey, 'Content-Type': 'application/json' },
          body: JSON.stringify({ accounts: state.accounts, activityEndDate: state.activityEndDate, createdAt: new Date().toISOString() })
        });
        if (!res.ok) { showToast('创建失败：HTTP ' + res.status); return; }
        const data = await res.json();
        const binId = data.metadata?.id;
        if (binId) {
          document.getElementById('inpSyncCode').value = binId;
          showToast('✅ 同步码已生成');
        } else {
          showToast('创建成功但未获取到 ID');
        }
      } catch (e) {
        showToast('❌ 创建失败：' + e.message);
      }
    }

    function updateSyncBtn() {
      const btn = document.getElementById('btnSync');
      if (!btn) return;
      const s = state.sync;
      if (!s.enabled) { btn.innerHTML = '☁️'; btn.title = '云同步（未启用）'; return; }
      const map = { off: '☁️', syncing: '⏳', on: '☁️✓', err: '☁️!' };
      const tip = { off: '云同步（未启用）', syncing: '云同步中…', on: '云同步已连接', err: '云同步失败' };
      btn.innerHTML = map[s.status] || '☁️';
      btn.title = tip[s.status] || '';
    }

    /* ============================================================
     * 初始化 & 事件绑定
     * ============================================================ */
    function init() {
      loadState();

      // URL hash 同步配置：#sync=<apiKey>&<code> — 跨域名迁移同步设置
      const hashMatch = location.hash.match(/^#sync=(.+)&(.+)$/);
      if (hashMatch) {
        const [ , encKey, encCode ] = hashMatch;
        state.sync.apiKey = decodeURIComponent(encKey);
        state.sync.code = decodeURIComponent(encCode);
        state.sync.enabled = true;
        cloudPulled = false; // 阻止推送，等 syncPull 先拉取
        persistLocal();
        history.replaceState(null, '', location.pathname);
        showToast('已从链接导入同步配置，正在拉取云端数据…');
      }

      render();
      updateSyncBtn();
      syncPull(); // 后台拉取，有新数据会自动 re-render

      document.getElementById('btnSync').addEventListener('click', () => {
        state.modal = 'syncSettings'; render();
      });
      document.getElementById('btnHelp').addEventListener('click', () => {
        state.modal = 'help'; render();
      });
      document.getElementById('btnExport').addEventListener('click', exportData);
      document.getElementById('btnImport').addEventListener('click', importDataFromFile);
      document.getElementById('btnDataCheck').addEventListener('click', () => { state.modal = 'dataCheck'; render(); });
      document.getElementById('btnChangelog').addEventListener('click', () => {
        state.modal = 'changelog'; render();
      });
      // 侧边栏导航
      document.querySelectorAll('[data-nav]').forEach(el => {
        el.addEventListener('click', () => switchTab(el.dataset.nav));
      });
      // 移动端汉堡菜单
      document.getElementById('btnHamburger').addEventListener('click', () => {
        state.mobileSidebarOpen = !state.mobileSidebarOpen;
        render();
      });
      document.getElementById('sidebarOverlay').addEventListener('click', () => {
        state.mobileSidebarOpen = false;
        render();
      });
    }
    init();

    // 暴露一些方法给 inline 调用
    window.openAddAccountModal = openAddAccountModal;
    window.switchTab = switchTab;
  </script>
</body>
</html>
